<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزانة تنظيم الأحذية 9 أرفف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c3e50; --secondary: #e67e22; --accent: #27ae60; --bg: #f4f7f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        header { padding: 15px; text-align: center; border-bottom: 2px solid var(--secondary); background: #fff; }
        header img { max-width: 120px; }
        .hero img { width: 100%; display: block; border-bottom: 4px solid var(--secondary); }
        .product-info { padding: 20px; text-align: center; }
        .price { font-size: 28px; color: var(--secondary); font-weight: 900; margin: 10px 0; }
        .badge { background: var(--accent); color: #fff; padding: 5px 15px; border-radius: 50px; display: inline-block; font-weight: bold; }
        .offer-card { border: 2px solid #eee; margin: 10px; padding: 15px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .offer-card.active { border-color: var(--secondary); background: #fff9f4; }
        .form-box { padding: 25px; background: #fff; border-top: 5px solid var(--secondary); }
        input, select, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--secondary); }
        .btn-submit { background: var(--secondary); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 22px; font-weight: 900; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        footer { text-align: center; padding: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/bcy7J7b/Chat-GPT-Image-13-2026-01-22-11.webp" alt="رتبها">
</header>

<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/hxXZgLNL/Chat-GPT-Image-13-2026-01-29-35.webp" alt="المنتج">
    </div>

    <div class="product-info">
        <h1>خزانة تنظيم الأحذية الاحترافية (9 أرفف)</h1>
        <p class="price">133 ريال</p>
        <div class="badge">شحن مجاني و سريع 🚚</div>
    </div>

    <div id="offers">
        <div class="offer-card active" onclick="selectOffer(1, 133, this)">
            <div><b>قطعة واحدة</b></div>
            <div>133 ريال</div>
        </div>
        <div class="offer-card" onclick="selectOffer(2, 184, this)">
            <div><b>قطعتين (وفر 82 ريال)</b></div>
            <div>184 ريال</div>
        </div>
        <div class="offer-card" onclick="selectOffer(3, 229, this)">
            <div><b>3 قطع (وفر 170 ريال)</b></div>
            <div>229 ريال</div>
        </div>
    </div>

    <div id="checkout" class="form-box">
        <h3 style="text-align:center; margin-bottom:15px;">سجل بياناتك لإتمام الطلب</h3>
        <form id="orderForm">
            <input type="text" name="full_name" placeholder="الاسم الكامل" required>
            <input type="tel" name="phone" placeholder="رقم الجوال (05xxxxxxxx)" required>
            <select name="city" required>
                <option value="">اختر المدينة</option>
                <option value="الرياض">الرياض</option>
                <option value="جدة">جدة</option>
                <option value="مكة">مكة</option>
                <option value="الدمام">الدمام</option>
                <option value="أخرى">مدينة أخرى</option>
            </select>
            <input type="text" name="address" placeholder="الحي / الشارع" required>
            <textarea name="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>
            
            <input type="hidden" id="qty" name="quantity" value="1">
            <input type="hidden" id="total" name="total_price" value="133">

            <button type="submit" id="submitBtn" class="btn-submit">تأكيد الطلب</button>
        </form>
    </div>
</div>

<footer>جميع الحقوق محفوظة &copy; 2026</footer>

<script>
    // الرابط الجديد الذي أرسلته
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx3xdQglwCtWpiJ73Mcy6g4qYUko6GIuGvUoIayCT3Ccn18-aHw-4fQRVL0Q1UotLlYBg/exec';
    const form = document.getElementById('orderForm');
    const btn = document.getElementById('submitBtn');

    function selectOffer(qty, price, el) {
        document.querySelectorAll('.offer-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('qty').value = qty;
        document.getElementById('total').value = price;
        document.getElementById('checkout').scrollIntoView({ behavior: 'smooth' });
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = "جاري إرسال طلبك...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('تم استلام طلبك بنجاح! سنتصل بك قريباً لتأكيد التوصيل.');
                form.reset();
                btn.disabled = false;
                btn.innerHTML = "تأكيد الطلب";
            })
            .catch(error => {
                alert('حدث خطأ. يرجى التأكد من اتصالك بالإنترنت والمحاولة مجدداً.');
                btn.disabled = false;
                btn.innerHTML = "تأكيد الطلب";
            });
    });
</script>

</body>
</html>
