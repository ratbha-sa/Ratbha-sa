<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر رتبها - خزانة تنظيم الأحذية</title>
    <!-- الأوسمة لمحركات البحث (SEO) -->
    <meta name="description" content="خزانة تنظيم أحذية بـ 9 أرفف، جودة عالية وشحن مجاني في السعودية.">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c3e50; --secondary: #e67e22; --accent: #27ae60; --bg: #f4f7f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; }
        header { padding: 15px; text-align: center; border-bottom: 2px solid var(--secondary); }
        header img { max-width: 120px; }
        .hero img { width: 100%; display: block; }
        .product-info { padding: 20px; text-align: center; }
        .price { font-size: 28px; color: var(--secondary); font-weight: 900; }
        .offer-card { border: 2px solid #eee; margin: 10px; padding: 15px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .offer-card.active { border-color: var(--secondary); background: #fff9f4; }
        .form-box { padding: 20px; background: #fff; margin-top: 20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-submit { background: var(--secondary); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 20px; font-weight: 900; cursor: pointer; }
        .loading { display: none; text-align: center; color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/bcy7J7b/Chat-GPT-Image-13-2026-01-22-11.webp" alt="Logo">
</header>

<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/hxXZgLNL/Chat-GPT-Image-13-2026-01-29-35.webp" alt="Banner">
    </div>

    <div class="product-info">
        <h1>خزانة تنظيم الأحذية (9 أرفف)</h1>
        <p class="price">133 ريال - شحن مجاني</p>
    </div>

    <div id="offers">
        <div class="offer-card active" onclick="selectOffer(1, 133, this)">
            <div><b>قطعة واحدة</b></div>
            <div>133 ريال</div>
        </div>
        <div class="offer-card" onclick="selectOffer(2, 184, this)">
            <div><b>قطعتين (خصم 82 ريال)</b></div>
            <div>184 ريال</div>
        </div>
        <div class="offer-card" onclick="selectOffer(3, 229, this)">
            <div><b>3 قطع (خصم 170 ريال)</b></div>
            <div>229 ريال</div>
        </div>
    </div>

    <div class="form-box">
        <h3 style="text-align:center">سجل بياناتك للطلب</h3>
        <form id="orderForm">
            <input type="text" name="full_name" placeholder="الاسم الكامل" required>
            <input type="tel" name="phone" placeholder="رقم الجوال" required>
            <select name="city" required>
                <option value="">اختر المدينة</option>
                <option value="الرياض">الرياض</option>
                <option value="جدة">جدة</option>
                <option value="مكة">مكة</option>
                <option value="الدمام">الدمام</option>
                <option value="أخرى">مدينة أخرى</option>
            </select>
            <input type="text" name="address" placeholder="العنوان (الحي/الشارع)" required>
            <textarea name="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>
            
            <input type="hidden" id="qty" name="quantity" value="1">
            <input type="hidden" id="total" name="total_price" value="133">

            <div id="loadingMsg" class="loading">جاري إرسال طلبك...</div>
            <button type="submit" id="submitBtn" class="btn-submit">تأكيد الطلب</button>
        </form>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwmojSHyHidvGaRqYFy1_4ZZkAd68NCWSgepDAXkuJE1PgNjWGYGHNzJ0Biv7wp2gPRaQ/exec';
    const form = document.getElementById('orderForm');

    function selectOffer(qty, price, el) {
        document.querySelectorAll('.offer-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('qty').value = qty;
        document.getElementById('total').value = price;
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loadingMsg').style.display = 'block';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('شكراً لك! تم استلام طلبك بنجاح وسنتصل بك قريباً.');
                form.reset();
                document.getElementById('submitBtn').style.display = 'block';
                document.getElementById('loadingMsg').style.display = 'none';
            })
            .catch(error => {
                alert('عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.');
                document.getElementById('submitBtn').style.display = 'block';
                document.getElementById('loadingMsg').style.display = 'none';
            });
    });
</script>

</body>
</html>
